id: scorchkit-loopback-probe
info:
  name: ScorchKit loopback probe
  author: scorchkit-security-review
  severity: info
  description: Detects the inert ScorchKit trusted-Nuclei loopback fixture.
  tags:
    - scorchkit
    - integration
http:
  - method: GET
    path:
      - "{{BaseURL}}/scorchkit-nuclei-fixture"
    matchers:
      - type: word
        part: body
        words:
          - "scorchkit-trusted-nuclei"
