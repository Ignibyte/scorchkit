name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to qualify
        required: true
        type: string
      publish:
        description: Publish the verified draft after qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
      source-date-epoch: ${{ steps.release.outputs.source-date-epoch }}
    steps:
      - name: Check out complete immutable history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Install the exact release toolchain
        shell: bash
        run: |
          toolchain="$(jq -r '.toolchain' source/release/policy.json)"
          rustup toolchain install "$toolchain" --profile minimal \
            --component clippy --component llvm-tools-preview --component rustfmt
      - name: Resolve and reject invalid release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$PUSH_TAG"
          else
            tag="$DISPATCH_TAG"
          fi
          if [ "$WORKFLOW_REF" != "refs/tags/$tag" ]; then
            echo "release qualification must execute from the selected tag ref" >&2
            exit 1
          fi
          revision="$(git -C source rev-list -n 1 "$tag")"
          source_date_epoch="$(git -C source show -s --format=%ct "$revision")"
          bash source/bin/release.sh preflight "$tag" "$revision" source
          {
            echo "tag=$tag"
            echo "revision=$revision"
            echo "source-date-epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Reproduce ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: scorchkit-aarch64-apple-darwin
            python: python3
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: scorchkit-x86_64-apple-darwin
            python: python3
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            asset: scorchkit-x86_64-pc-windows-msvc.exe
            python: python
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset: scorchkit-x86_64-unknown-linux-gnu
            python: python3
    steps:
      - name: Check out first clean source path
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          path: source-a
      - name: Check out second clean source path
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          path: source-b
      - name: Install pinned native Rust target
        shell: bash
        run: |
          toolchain="$(jq -r '.toolchain' source-a/release/policy.json)"
          rustup toolchain install "$toolchain" --profile minimal \
            --component clippy --component llvm-tools-preview --component rustfmt \
            --target "${{ matrix.target }}"
      - name: Build twice and compare exact bytes
        shell: bash
        env:
          PYTHON_COMMAND: ${{ matrix.python }}
          SCORCHKIT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SCORCHKIT_RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: bash source-a/bin/release.sh build "${{ matrix.target }}" source-a source-b output
      - name: Upload one exact target binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: output/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  aggregate:
    name: Verify, sign, and stage release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Download every immutable matrix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: stage
          merge-multiple: true
      - name: Install checksum-verified Syft and Cosign
        shell: bash
        run: |
          bash source/bin/release.sh install-tools "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Assemble exact manifest, SBOM, provenance, and checksums
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source-date-epoch }}
        run: |
          bash source/bin/release.sh assemble stage \
            "${{ needs.preflight.outputs.tag }}" \
            "${{ needs.preflight.outputs.revision }}" \
            "${{ github.repository }}" \
            "$SOURCE_DATE_EPOCH"
      - name: Sign every publication subject with GitHub OIDC
        shell: bash
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: bash source/bin/release.sh sign stage "$RELEASE_IDENTITY" "$RELEASE_REVISION"
      - name: Verify exact subjects, signatures, and negative cases offline
        shell: bash
        env:
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          bash source/bin/release.sh verify stage
          bash source/bin/release.sh verify-signatures stage "$RELEASE_IDENTITY" "$RELEASE_REVISION"
          bash source/bin/release.sh verify-signature-negatives stage "$RELEASE_IDENTITY" "$RELEASE_REVISION"
      - name: Retain the complete verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.preflight.outputs.tag }}
          path: stage/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Create draft, read it back, verify, then publish
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite $RELEASE_TAG" >&2
            exit 1
          fi
          mapfile -t assets < <(find stage -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --draft --verify-tag --title "ScorchKit $RELEASE_TAG" \
            --notes "Verified by the repository-owned reproducible release workflow."
          verify_dir="$RUNNER_TEMP/release-readback"
          mkdir -p "$verify_dir"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          bash source/bin/release.sh verify "$verify_dir"
          bash source/bin/release.sh verify-signatures \
            "$verify_dir" "$RELEASE_IDENTITY" "$RELEASE_REVISION"
          while IFS= read -r staged; do
            name="${staged##*/}"
            cmp --silent "$staged" "$verify_dir/$name"
          done < <(find stage -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)
          gh release edit "$RELEASE_TAG" --draft=false --latest
