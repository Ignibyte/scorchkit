[package]
name = "custom_scanner"
version = "0.1.0"
edition = "2021"
description = "Example third-party ScorchKit DAST scan module"
publish = false

[lib]
name = "custom_scanner"
path = "src/lib.rs"

[dependencies]
# Depend on scorchkit for its public API and traits.
# In a published integration, pin the reviewed ScorchKit 3.x release you support.
scorchkit = { path = "../.." }

# Required for async trait implementations.
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
