# Composition roots contain wiring rather than domain behavior. Native-Windows files cannot
# produce observable mutants in the Linux-hosted runner; their required CI lane cross-compiles and
# executes the platform lifecycle suite. Keep every host-active library file in the mutation set.
copy_target = false
copy_vcs = false
timeout_multiplier = 3.0

exclude_globs = [
  "src/main.rs",
  "src/windows_support.rs",
  "crates/scorchkit-tools/src/windows_owned_process.rs",
]
