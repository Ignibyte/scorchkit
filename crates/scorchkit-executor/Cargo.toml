[package]
name = "scorchkit-executor"
version = "3.0.0"
edition = "2021"
description = "Bounded provider-neutral job scheduling for ScorchKit"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
scorchkit-config = { version = "=3.0.0", path = "../scorchkit-config" }
scorchkit-core = { version = "=3.0.0", path = "../scorchkit-core" }
scorchkit-policy = { version = "=3.0.0", path = "../scorchkit-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
