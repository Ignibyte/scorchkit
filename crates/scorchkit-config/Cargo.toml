[package]
name = "scorchkit-config"
version = "3.0.0"
edition = "2021"
description = "Provider-neutral configuration contracts for ScorchKit"
license = "MIT"

[features]
default = []
cloud = []
team = ["dep:chrono", "dep:scorchkit-control"]

[dependencies]
chrono = { version = "0.4", optional = true }
scorchkit-control = { version = "=3.0.0", path = "../scorchkit-control", optional = true }
scorchkit-core = { version = "=3.0.0", path = "../scorchkit-core" }
scorchkit-policy = { version = "=3.0.0", path = "../scorchkit-policy" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
