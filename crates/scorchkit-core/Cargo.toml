[package]
name = "scorchkit-core"
version = "3.0.0"
edition = "2021"
description = "Agent-neutral findings, evidence, targets, results, and events for ScorchKit"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
scorchkit-policy = { version = "=3.0.0", path = "../scorchkit-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
