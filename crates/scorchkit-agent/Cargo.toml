[package]
name = "scorchkit-agent"
version = "3.0.0"
edition = "2021"
description = "Provider-neutral agent host configuration and manifest contracts for ScorchKit"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
