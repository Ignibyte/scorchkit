[package]
name = "scorchkit-mcp"
version = "3.0.0"
edition = "2021"
description = "Agent-neutral MCP schemas and tool contracts for ScorchKit"
license = "MIT"

[dependencies]
rmcp = { version = "1.3", features = ["server", "macros"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
