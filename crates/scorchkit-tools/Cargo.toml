[package]
name = "scorchkit-tools"
version = "3.0.0"
edition = "2021"
description = "Bounded external-process contracts and execution for ScorchKit"
license = "MIT"

[dependencies]
async-trait = "0.1"
scorchkit-core = { version = "=3.0.0", path = "../scorchkit-core" }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"
