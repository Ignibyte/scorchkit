
[package]
name = "scorchkit"
version = "3.0.0"
edition = "2021"
description = "Web application security testing toolkit and orchestrator"
license = "MIT"
[workspace]
members = ["crates/*"]
resolver = "2"

[features]
default = []
storage = [
  "dep:sqlx",
  "dep:croner",
  "dep:scorchkit-storage",
  "dep:whoami",
  "scorchkit-cli/storage",
]
mcp = [
  "storage",
  "dep:axum",
  "dep:rmcp",
  "dep:scorchkit-mcp",
  "dep:subtle",
  "dep:tokio-util",
  "dep:zeroize",
  "scorchkit-cli/mcp",
]
control-api = [
  "storage",
  "dep:axum",
  "dep:subtle",
  "dep:zeroize",
  "scorchkit-cli/control-api",
]
team = [
  "control-api",
  "dep:ring",
  "scorchkit-cli/team",
  "scorchkit-config/team",
]
infra = ["dep:ipnet", "dep:hickory-resolver", "scorchkit-cli/infra"]
# SHA-256 is always available for supply-chain and evidence integrity; infra reuses it for
# content-addressed CVE cache filenames.
# WORK-150: cloud family seam — trait + orchestrator + CLI wiring only.
cloud = ["scorchkit-cli/cloud", "scorchkit-config/cloud"]
# Quarantined native AWS checks. The code compiles in tests while its provider
# transport is redesigned to enforce engagement-bound endpoint and DNS policy.
aws-native = [
  "cloud",
  "dep:aws-config",
  "dep:aws-sdk-iam",
  "dep:aws-sdk-s3",
  "dep:aws-sdk-ec2",
  "dep:aws-sdk-cloudtrail",
]
# Quarantined native GCP checks; see the provider-transport roadmap batch.
gcp-native = ["cloud", "dep:google-cloud-auth"]
# Quarantined native Azure checks; see the provider-transport roadmap batch.
azure-native = ["cloud", "dep:azure_identity", "dep:azure_core"]

[dependencies]

# Async trait
async-trait = "0.1"

# Base64 for JWT
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }
# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"

# Borrowed bounded job execution.
futures-util = "0.3"

# Rate limiting
governor = "0.8"

# Local-only validation and operation extraction for supplied GraphQL SDL.
graphql-parser = "0.4.1"

# Terminal UI
indicatif = "0.18"

# Local-only CycloneDX validation. Default features are intentionally disabled because they add
# HTTP and filesystem schema retrievers.
jsonschema = { version = "=0.49.9", default-features = false }

# Package URL parsing and canonical serialization for supplied identifiers only.
packageurl = { version = "=0.6.0", features = ["serde"] }
regex = { version = "1.12.3", default-features = false, features = [
  "std",
  "perf",
] }

# HTTP
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
  "cookies",
  "multipart",
  "stream",
], default-features = false }

# TLS inspection
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Agent-neutral workspace foundations. The root package is the composition
# facade and must remain the only package that depends on every adapter layer.
scorchkit-agent = { version = "=3.0.0", path = "crates/scorchkit-agent" }
scorchkit-cli = { version = "=3.0.0", path = "crates/scorchkit-cli" }
scorchkit-cloud = { version = "=3.0.0", path = "crates/scorchkit-cloud" }
scorchkit-code = { version = "=3.0.0", path = "crates/scorchkit-code" }
scorchkit-config = { version = "=3.0.0", path = "crates/scorchkit-config" }
scorchkit-control = { version = "=3.0.0", path = "crates/scorchkit-control" }
scorchkit-core = { version = "=3.0.0", path = "crates/scorchkit-core" }
scorchkit-executor = { version = "=3.0.0", path = "crates/scorchkit-executor" }
scorchkit-extension = { version = "=3.0.0", path = "crates/scorchkit-extension" }
scorchkit-infra = { version = "=3.0.0", path = "crates/scorchkit-infra" }
scorchkit-mcp = { version = "=3.0.0", path = "crates/scorchkit-mcp", optional = true }
scorchkit-policy = { version = "=3.0.0", path = "crates/scorchkit-policy" }
scorchkit-storage = { version = "=3.0.0", path = "crates/scorchkit-storage", optional = true }
scorchkit-tools = { version = "=3.0.0", path = "crates/scorchkit-tools" }
scorchkit-web = { version = "=3.0.0", path = "crates/scorchkit-web" }

# HTML parsing
scraper = "0.27"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"

# Bounded, no-extraction validation of Grype's Zstandard-compressed tar database archives.
tar = "=0.4.46"

# Temporary files (used by tool wrappers that need to materialise
# wordlists / community lists for external CLIs).
tempfile = "3"

# Error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

# UUID for scan IDs
uuid = { version = "1", features = ["v4", "serde"] }
wasmi = { version = "1.1.0", features = ["extra-checks"] }
wat = "1"
webpki-roots = "1"
x509-parser = "0.16"

# Bounded structural validation for policy-owned OSV offline database archives.
zip = { version = "=8.6.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
zstd = { version = "=0.13.3", default-features = false }

# AWS SDK crates used by quarantined native-check tests.
[dependencies.aws-config]
version = "1"
optional = true

[dependencies.aws-sdk-cloudtrail]
version = "1"
optional = true
default-features = false
features = ["default-https-client", "rt-tokio"]

[dependencies.aws-sdk-ec2]
version = "1"
optional = true
default-features = false
features = ["default-https-client", "rt-tokio"]

[dependencies.aws-sdk-iam]
version = "1"
optional = true
default-features = false
features = ["default-https-client", "rt-tokio"]

[dependencies.aws-sdk-s3]
version = "1"
optional = true
default-features = false
features = ["default-https-client", "rt-tokio"]

[dependencies.axum]
version = "0.8"
default-features = false
features = ["http1", "tokio", "json"]
optional = true

[dependencies.azure_core]
version = "0.22"
optional = true

# WORK-128: Azure auth for native posture checks.
[dependencies.azure_identity]
version = "0.22"
optional = true

[dependencies.croner]
version = "3"
optional = true

# WORK-127: GCP auth for native posture checks.
[dependencies.google-cloud-auth]
version = "1"
optional = true

# Uses default features (`system-config` + `tokio`) — we need both for
# `TokioResolver::builder_tokio()` to resolve from `/etc/resolv.conf`.
# `dnssec-aws-lc-rs` enables full DNSSEC chain validation via
# `ResolverOpts::validate = true` (WORK-145). aws-lc-rs matches the
# crypto provider rustls already uses (WORK-143) — single crypto
# backend across the binary.
[dependencies.hickory-resolver]
version = "0.26"
optional = true
features = ["dnssec-aws-lc-rs"]

[dependencies.ipnet]
version = "2"
optional = true

[dependencies.ring]
version = "0.17"
optional = true

[dependencies.rmcp]
version = "1.3"
features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
  "macros",
]
optional = true

[dependencies.sha2]
version = "0.10"

[dependencies.sqlx]
version = "0.9"
default-features = false
features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
]
optional = true

[dependencies.subtle]
version = "2"
optional = true

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]
optional = true

[dependencies.whoami]
version = "2"
default-features = false
features = ["std"]
optional = true

[dependencies.zeroize]
version = "1"
optional = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd = "2"
croner = "3"
httpmock = "0.8"
predicates = "3"
rmcp = { version = "1.3", features = [
  "client",
  "server",
  "transport-io",
  "macros",
] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
future_not_send = "allow"

# Faster mutation builds. cargo-mutants recompiles the crate for every mutant;
# debug information adds cost without improving the verdict.
[profile.mutants]
inherits = "test"
debug = "none"
